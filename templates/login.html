<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - GHÉ.NOW</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #FBFFFE;
            --text-main: #141414;
            --brand-dark: #00638E;
            --brand-hover: #4EC3CB;
            --glass-border: #BFD8E3;
            --blob-1: #004A6B;
            --blob-2: #00638E;
            --blob-3: #8CB9CC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* --- AZURE BLOBS --- */
        .liquid-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.15;
        }
        .blob-1 { width: 450px; height: 450px; background: var(--blob-1); top: -10%; left: -5%; }
        .blob-2 { width: 500px; height: 500px; background: var(--blob-2); bottom: -15%; right: -5%; }
        .blob-3 { width: 400px; height: 400px; background: var(--blob-3); top: 30%; left: 30%; opacity: 0.1; }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: rgba(251, 255, 254, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 16px 40px rgba(0, 74, 107, 0.06);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* LOGO */
        .logo-link {
            display: inline-block;
            text-decoration: none;
            margin-bottom: 24px;
        }
        .logo-text-brand {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: var(--text-main);
        }
        .logo-dot {
            color: var(--brand-dark);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 14px;
            color: #555;
            margin-bottom: 28px;
        }

        /* FORM CHÍNH */
        form { text-align: left; }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #FFFFFF;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }
        input::placeholder { color: #A0AAB2; font-family: 'Outfit', sans-serif; }
        input:focus {
            border-color: var(--brand-dark);
            box-shadow: 0 0 0 3px rgba(78, 195, 203, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--brand-dark);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-submit:hover {
            background: var(--brand-hover);
        }
        .btn-submit:active {
            transform: scale(0.98);
        }

        /* HIỂN THỊ LỖI / THÀNH CÔNG */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            text-align: center;
        }

        .flash-msg {
            background: rgba(78, 195, 203, 0.1);
            color: var(--brand-dark);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(78, 195, 203, 0.2);
            text-align: center;
        }

        .auth-footer {
            margin-top: 28px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        .auth-footer a {
            color: var(--brand-dark);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }
        .auth-footer a:hover { 
            color: var(--brand-hover); 
        }

        @media (max-width: 480px) {
            .auth-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>

    <div class="liquid-blob blob-1"></div>
    <div class="liquid-blob blob-2"></div>
    <div class="liquid-blob blob-3"></div>

    <div class="auth-card">
        <a href="/" class="logo-link">
            <span class="logo-text-brand">GHÉ<span class="logo-dot">.</span>NOW</span>
        </a>

        <h1>Đăng nhập</h1>
        <p class="subtitle">Quản lý và cập nhật điểm chạm của bạn</p>

        <!-- Khối hiển thị thông báo flash từ app.py -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-msg"><i class="fa-solid fa-circle-check"></i> {{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% if error %}
            <div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Đăng Nhập</button>
        </form>

        <div class="auth-footer">
            Chưa có tài khoản? <a href="/register">Tạo trang miễn phí</a>
        </div>
    </div>

</body>
</html>
